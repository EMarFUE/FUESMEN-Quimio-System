<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sedes y sillones · Turnero</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body style="visibility:hidden">
  <div class="contenedor">
    <div class="encabezado-sesion">
      <div>
        <img src="../assets/FUESMEN-Logo.png" alt="FUESMEN" style="height: 48px; width: auto; margin-bottom: 8px;" />
        <div class="breadcrumb"><a href="../index.html">Inicio</a> &gt; <a href="index.html">Turnero</a> &gt; Sedes y sillones</div>
        <h1 style="margin-bottom:0;">Sedes y sillones</h1>
      </div>
      <div style="text-align:right;">
        <div class="datos-sesion" id="datos-sesion"></div>
        <button class="boton-secundario" style="margin-top:8px;" onclick="cerrarSesion('../login.html')">Cerrar sesión</button>
      </div>
    </div>

    <div id="mensaje-sedes" class="mensaje-info" style="display:none;"></div>

    <div id="bloque-seed" class="boton-seed" style="display:none;">
      <p style="margin:0 0 12px; color:var(--color-muted); font-size:13.5px;">
        Todavía no hay sedes cargadas. Los datos de referencia son los que quedaron definidos
        en el alcance del módulo (horarios, cantidad de sillones y sillón backup) — se pueden
        editar después de cargarlos.
      </p>
      <button id="boton-cargar-seed" class="boton-principal" style="width:auto; padding:10px 18px;">Cargar datos iniciales de referencia</button>
    </div>

    <div id="contenedor-sedes"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/turnero-sedes.js"></script>
  <script>
    requireAuth((user, datosUsuario) => {
      const rolLabel = ROLES[datosUsuario.rol] || datosUsuario.rol;
      document.getElementById("datos-sesion").innerHTML =
        `Hola, <strong>${escaparHtml(datosUsuario.nombre || user.email)}</strong> · rol: <strong>${rolLabel}</strong>`;

      if (datosUsuario.rol !== "administrador") {
        document.body.innerHTML = `<div class="pantalla-error"><p>Esta pantalla es exclusiva del administrador.</p><a href="index.html">Volver a Turnero</a></div>`;
        return;
      }

      iniciarSedes();
    }, "../login.html");
  </script>
</body>
</html>
